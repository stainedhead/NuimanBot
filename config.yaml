server:
  log_level: info
  debug: false

security:
  input_max_length: 4096
  vault_path: "./data/vault.enc"

storage:
  type: file
  dsn: "./data"  # Auto-initialized on startup (directories + default admin user)

llm:
  default_model:
    primary: anthropic/claude-sonnet
    max_tokens: 1024
    temperature: 0.7
    fallbacks:
      - anthropic/claude-haiku
  models:
    claude-sonnet:
      alias: claude-sonnet
      provider_config_id: anthropic-main
    claude-haiku:
      alias: claude-haiku
      provider_config_id: anthropic-main
  providers:
    - id: anthropic-main
      type: anthropic
      api_key: "your-api-key-here"  # Set via NUIMANBOT_LLM_PROVIDERS_0_APIKEY env var

# Gateway Configuration — Multi-Bot Architecture
#
# NuimanBot supports two tiers of bot credentials:
#
# 1. SYSTEM BOTS (this file — config.yaml)
#    - Configured here under gateways.slack / gateways.telegram
#    - Managed by the system administrator
#    - Serve as the default fallback for all users
#    - Credentials stored in plaintext or via environment variables
#
# 2. USER-OWNED BOTS (data/bots.json)
#    - Created via Admin API or CLI: ./bin/nuimanbot admin bot <platform> create
#    - Can be public (shared with allowed users) or private (single owner)
#    - Credentials encrypted at rest with AES-256-GCM
#    - Support BYOB (Bring Your Own Bot): users register their own Slack/Telegram bots
#
# Bot Selection Priority (highest to lowest):
#   1. User's private bot (if configured in bots.json)
#   2. Public bot the user is allowed to use (bots.json, allowedUserIDs)
#   3. System bot (this file)
#
# To let users bring their own bots:
#   ./bin/nuimanbot admin bot slack create --name "my-bot" --owner-user-id user-123
#   ./bin/nuimanbot admin bot telegram create --name "my-tg-bot" --owner-user-id user-123
#
# See support_docs/admin-guide.md for full bot management documentation.
#
gateways:
  cli:
    enabled: true
    debug_mode: false
    history_file: ".nuimanbot_history"
  slack:
    enabled: false
    # System-level Slack bot credentials (fallback for all users)
    # bot_token: "xoxb-..."      # Bot User OAuth Token
    # app_token: "xapp-..."      # App-Level Token (Socket Mode)
    # workspace_id: "T..."       # Slack Workspace ID
  web_ui:
    enabled: true
    addr: ":8081"
  telegram:
    enabled: false
    # System-level Telegram bot credentials (fallback for all users)
    # token: "bot_token_from_botfather"
    # webhook_url: "https://yourdomain.com/telegram"
    # dm_policy: "pairing"

tools:
  entries:
    calculator:
      enabled: true
    datetime:
      enabled: true

# Agent Skills System (Anthropic-style file-based skills)
# Skills are stored in the NuimanBot data directory
skills:
  enabled: true
  roots:
    # Shared skills (available to all users)
    - path: "./data/skills/shared"
      scope: 2  # ScopeProject
    # User-specific skills (per-user skill directories)
    # Format: ./data/skills/users/{platform}_{uid}/
    - path: "./data/skills/users/cli_user"
      scope: 1  # ScopeUser
    # Enterprise skills can be added here (highest priority)
    # - path: "./data/skills/enterprise"
    #   scope: 0  # ScopeEnterprise

alerting:
  enabled: true
  service_name: "nuimanbot"
  throttle_window: 300  # 5 minutes
  channels:
    log:
      enabled: true
    slack:
      enabled: false
      # webhook_url: "https://hooks.slack.com/services/T.../B.../xxx"
      # channel: "#alerts"
      # username: "NuimanBot"
    email:
      enabled: false
      # smtp_host: "smtp.example.com"
      # smtp_port: 587
      # username: "alerts@example.com"
      # password: "smtp-password"
      # from: "alerts@example.com"
      # recipients: "admin@example.com,ops@example.com"

mcp:
  client:
    timeout: "30s"
