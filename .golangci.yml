version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell

  settings:
    errcheck:
      check-blank: false  # Allow intentional blank-assignment error ignoring (_, _ = f())
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*net/http.Response.Body).Close
        - (*github.com/sashabaranov/go-openai.Stream).Close
        - (*encoding/json.Encoder).Encode

    staticcheck:
      checks:
        - "all"
        - "-SA1029"  # Context key should not be built-in type (test simplicity)
        - "-SA4008"  # Loop condition never changes (acceptable in some patterns)
        - "-SA9003"  # Empty branch (acceptable for deferred cleanup with logging)
        - "-ST1005"  # Error strings should not be capitalized (pre-existing, tracked)
        - "-ST1003"  # Package names should not use underscores (pre-existing package names, tracked)
        - "-QF1001"  # Could apply De Morgan's law (pre-existing, tracked)
        - "-QF1011"  # Could omit type from declaration (pre-existing, tracked)
        - "-S1025"   # Unnecessary fmt.Sprintf (pre-existing, tracked)
        - "-SA4006"  # Value of assignment never used (pre-existing in main.go, tracked)
        - "-SA4000"  # Identical expressions in comparison (pre-existing in tests, tracked)

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Allow unchecked errors in test files
      - path: _test\.go
        linters:
          - errcheck
          - unused

      # Allow context.WithValue with string keys in tests
      - path: _test\.go
        linters:
          - staticcheck
        text: "SA1029"

      # Allow empty branches with best-effort comments
      - linters:
          - staticcheck
        text: "SA9003"

      # Allow unchecked Close() calls in error paths
      - linters:
          - errcheck
        text: "Error return value of .+\\.Close.+ is not checked"

      # Allow unchecked Delete() calls in best-effort paths
      - linters:
          - errcheck
        text: "Error return value of .+\\.Delete.+ is not checked"

      # Pre-existing ineffectual assignment in main.go
      - path: "cmd/nuimanbot/main.go"
        linters:
          - ineffassign

      # Allow unused helper functions in test files
      - path: _test\.go
        linters:
          - unused
        text: "func .+ is unused"
