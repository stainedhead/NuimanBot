<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NuimanBot Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/static/img/NuimanProfile.jpg">
</head>
<body class="bg-slate-900 min-h-screen">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <div class="flex flex-col items-center">
                <img src="/static/img/NuimanWebImage.jpg" alt="Nuiman" class="h-20 w-20 rounded-full border-4 border-amber-400 shadow-lg mb-4">
                <h2 class="text-center text-3xl font-extrabold text-white">
                    Sign in to NuimanBot Admin
                </h2>
            </div>

            {{if .Error}}
            <div class="rounded-md bg-red-50 p-4">
                <div class="flex">
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-red-800">
                            {{.Error}}
                        </h3>
                    </div>
                </div>
            </div>
            {{end}}

            <form class="mt-8 space-y-6" action="/admin/login" method="POST">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

                <div class="rounded-md shadow-sm -space-y-px">
                    <div>
                        <label for="username" class="sr-only">Username</label>
                        <input
                            id="username"
                            name="username"
                            type="text"
                            required
                            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-amber-500 focus:border-amber-500 focus:z-10 sm:text-sm"
                            placeholder="Username"
                        >
                    </div>
                    <div>
                        <label for="password" class="sr-only">Password</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            required
                            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-amber-500 focus:border-amber-500 focus:z-10 sm:text-sm"
                            placeholder="Password"
                        >
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input
                            id="remember-me"
                            name="remember-me"
                            type="checkbox"
                            class="h-4 w-4 text-amber-500 focus:ring-amber-500 border-gray-300 rounded"
                        >
                        <label for="remember-me" class="ml-2 block text-sm text-slate-200">
                            Remember me
                        </label>
                    </div>
                </div>

                <div>
                    <button
                        type="submit"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-slate-900 bg-amber-500 hover:bg-amber-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500"
                    >
                        Sign in
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
