<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - NuimanBot Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-gray-900">Users</h1>
                <a href="/admin/users/create" class="btn-primary">
                    <svg class="h-4 w-4 mr-2 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Create User
                </a>
            </div>

            {{if .Users}}
            <div class="overflow-x-auto table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{range .Users}}
                        <tr>
                            <td>{{.UserID}}</td>
                            <td>{{.FirstName}} {{.LastName}}</td>
                            <td>{{.PrimaryEmail}}</td>
                            <td>
                                <span class="badge {{if eq .Role "admin"}}badge-info{{else}}badge-gray{{end}}">
                                    {{.Role}}
                                </span>
                            </td>
                            <td>
                                <a href="/admin/users/{{.UserID}}/edit" class="text-blue-600 hover:text-blue-800 mr-3">Edit</a>
                                <form action="/admin/users/{{.UserID}}/delete" method="POST" class="inline" onsubmit="return confirm('Are you sure?')">
                                    <button type="submit" class="text-red-600 hover:text-red-800">Delete</button>
                                </form>
                            </td>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>
            {{else}}
            <p class="text-center text-gray-500 py-8">No users found. <a href="/admin/users/create" class="text-blue-600">Create one</a></p>
            {{end}}
        </div>
    </div>
</body>
</html>
