<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs - NuimanBot Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" href="/static/img/NuimanProfile.jpg">
</head>
<body class="bg-gray-100 min-h-screen">
    {{template "nav" .}}
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-gray-900">Jobs</h1>
            </div>

            <form method="POST" action="/admin/jobs" class="mb-8 bg-amber-50 border border-amber-200 rounded-lg p-4" x-data="{ context: 'none' }">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

                <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Title</label>
                <input type="text" id="title" name="title" required placeholder="Job title..."
                       class="w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 mb-4">

                <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                <textarea id="description" name="description" rows="3" placeholder="Describe what the agent should do..."
                          class="w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 mb-4"></textarea>

                <fieldset class="mb-4">
                    <legend class="block text-sm font-medium text-gray-700 mb-2">Context</legend>
                    <label class="inline-flex items-center mr-4">
                        <input type="radio" name="context" value="none" x-model="context" checked class="mr-2">
                        No context
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="context" value="project" x-model="context" class="mr-2">
                        Project
                    </label>
                </fieldset>

                <div x-show="context === 'project'" class="mb-4">
                    <label for="project_id" class="block text-sm font-medium text-gray-700 mb-2">Project ID</label>
                    <input type="text" id="project_id" name="project_id" placeholder="Project ID..."
                           class="w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500">
                </div>

                <button type="submit" class="btn-primary">New Job</button>
            </form>

            {{if .Jobs}}
            <div class="overflow-x-auto">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Status</th>
                            <th>Context</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{range .Jobs}}
                        <tr>
                            <td><a href="/admin/jobs/{{.ID}}" class="text-teal-700 hover:underline">{{.Title}}</a></td>
                            <td>{{.Status}}</td>
                            <td>{{.ContextType}}</td>
                            <td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
                            <td>
                                <a href="/admin/jobs/{{.ID}}" class="text-teal-600 hover:text-teal-800">Open</a>
                            </td>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>
            {{else}}
            <p class="text-gray-500">No jobs yet — create one above.</p>
            {{end}}
        </div>
    </div>
</body>
</html>
